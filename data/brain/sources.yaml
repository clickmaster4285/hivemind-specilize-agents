    collection: marketing
    publisher: Google
    licence: CC-BY-4.0            # Google Developers Site Policies, checked 2026-10-28 (code samples: Apache-2.0)
    language: en
    refresh_every: 14d           # reference docs; they change slowly
    max_pages: 150               # raised 2026-10-29 — cover structured data + crawling + ranking guides
    reason: First marketing/SEO source — authoritative Search Central guidance (crawling, indexing, SEO)

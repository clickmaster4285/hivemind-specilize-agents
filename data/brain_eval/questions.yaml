# Brain evaluation set (doc/BRAIN_DESIGN.md §9). Run: python -m src.brain.evaluate
# docs: acceptable answer pages, matched against the end of the document URL
#       (".../networking/dns/aging-scavenging" matches "aging-scavenging").
# facts: optional key terms the answer must contain (answer_eval.py); "a|b" = either is fine.
# out_of_scope: the brain must answer "not enough evidence" (nothing in the knowledge base covers it).
# Coverage: all 34 enabled sources (it / development / marketing). The 32 added 2026-10-30 have
# best-effort `docs:` endings — verify them against ingested URLs with `python -m src.brain.evaluate`.
# Add questions whenever a source is added.


services:
  # Postgres + pgvector — knowledge brain (vectors + full-text + trigram search).
  # Start only the database:  docker compose up -d db
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: multeagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: multeagent
    ports:
      # localhost only — never expose the database on the LAN
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multeagent -d multeagent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Private web search (SearXNG) — only used when the user asks to search the web.
  # http://127.0.0.1:8888 · start with:  docker compose up -d searxng
  searxng:
    image: searxng/searxng:2026.9.30-a9d990033
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    ports:
      # localhost only — never expose it on the LAN
      - "127.0.0.1:8888:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  # Database browser (tables, schemas, queries) at http://localhost:5050
  # Optional tool — start with:  docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:9.8
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./deploy/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db
    restart: unless-stopped

# The API and UI run on the host (./start.sh), not here: see doc/DOCKER_FULL_STACK_PLAN.md (O28).

volumes:
  pgdata:
  pgadmin_data:

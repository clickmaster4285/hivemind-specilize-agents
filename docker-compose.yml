services:
  # Postgres + pgvector — knowledge brain (vectors + full-text + trigram search).
  # Start only the database:  docker compose up -d db
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: multeagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: multeagent
    ports:
      # localhost only — never expose the database on the LAN
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multeagent -d multeagent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Database browser (tables, schemas, queries) at http://localhost:5050
  # Optional tool — start with:  docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:9.8
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./deploy/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://multeagent:${POSTGRES_PASSWORD}@db:5432/multeagent
      LLM_BASE_URL: http://host.docker.internal:11434
      JWT_SECRET: change-me-in-production
      API_HOST: 0.0.0.0
      API_PORT: 8787
    ports:
      - "8787:8787"
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "worker_main.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://multeagent:${POSTGRES_PASSWORD}@db:5432/multeagent
      LLM_BASE_URL: http://host.docker.internal:11434
      LLM_SLOTS: "1"
    depends_on:
      - db
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Scale horizontally: docker compose up --scale worker=3
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  pgadmin_data:
  caddy_data:
